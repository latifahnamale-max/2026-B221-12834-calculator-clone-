<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Web Calculator Interface Design</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calcultor">
        <div class="screen">
            <div class="dis">0</div>
        </div>

        <div class=" keys">
            <button class="ac">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="btn">&#247</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="btn">X</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="btn">-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="btn">+</button>
            <button class="bt">0</button>
            <button>.</button>
            <button class="btn">=</button>
        </div>


    </div>
</body>

</html>
